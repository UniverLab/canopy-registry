name = "kilo"
config_path = ".config/kilo/kilo.json"
command_format = "merged"
mcp_servers_key = ["mcp"]
deprecated_keys = []
unsupported_keys = ["autoApprove", "disabled", "tools", "headers"]
skills_dir = ".agents/skills"
instruction_file = "AGENTS.md"

[fields_mapping]
env = "environment"

[required_fields]
type = ["stdio", "local"]

[server_extras.canopy]
enabled = true

[server_extras.filesystem]
enabled = true

[server_extras.fetch]
enabled = true

[cli]
binary = "kilo"
# Without the permission flag, a headless kilo run auto-REJECTS every tool
# call it did not already have rights for and then exits 0 with no output —
# it does not hang or error, it just silently does nothing. Measured
# 2026-08-07: a reviewer node died five times in a row on
# "permission requested: bash (git diff ...); auto-rejecting".
# `--dangerously-skip-permissions` approves what is not explicitly denied,
# matching the opencode family it is forked from; `--auto` approves
# everything and is the blunter option.
headless_mode = "run --dangerously-skip-permissions"
interactive_args = ""
model_flag = "-m"
supports_working_dir = true
working_dir_flag = ""
accent_color = [0, 200, 100]
resume_args = "-c"
session_list_cmd = "session list"
session_resume_cmd = "--session"
# List-after-run session id capture (RS1 phase 2). kilo also honors
# `--format json` (opencode-family). Verified 2026-07-17:
#   $ kilo session list --format json
#   [ { "id": "ses_094c24b9effe22TCWKl6BDYvSu", "title": "...", ... }, ... ]
session_list_format_args = "--format json"
session_id_pattern = '"id"\s*:\s*"([^"]+)"'
