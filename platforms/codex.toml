name = "codex"
config_path = ".codex/config.toml"
config_format = "toml"
toml_array_format = false
mcp_servers_key = ["mcp_servers"]
deprecated_keys = []
unsupported_keys = ["headers"]
skills_dir = ".agents/skills"
instruction_file = "AGENTS.md"

[required_fields]
type = ["stdio"]

[cli]
binary = "codex"
headless_mode = "exec --dangerously-bypass-approvals-and-sandbox --skip-git-repo-check"
interactive_args = ""
resume_args = "resume"
model_flag = "-m"
supports_working_dir = true
working_dir_flag = "-C"
yolo_flag = "--dangerously-bypass-approvals-and-sandbox"
accent_color = [87, 199, 195]
invocation_template = "-m {{model}} -C {{workdir}} -c 'model_reasoning_effort=\"{{effort}}\"' {{prompt}}"

[cli.effort_declaration]
form = "-c"
values = ["minimal", "low", "medium", "high", "xhigh"]
