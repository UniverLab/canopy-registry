name = "antigravity"
provider = "Google"
tool_name = "Antigravity CLI"
config_path = ".gemini/antigravity-cli/mcp_config.json"
mcp_servers_key = ["mcpServers"]
deprecated_keys = []
unsupported_keys = ["autoApprove", "disabled", "tools", "headers"]
skills_dir = ".agents/skills"
instruction_file = "GEMINI.md"
# Personal instructions every session loads, home-relative (checked 2026-11-17): https://antigravity.google/docs/rules
user_instruction_file = ".gemini/GEMINI.md"
# Source: https://antigravity.google/docs/getting-started?tab=cli (checked 2026-11-17)
docs_url = "https://antigravity.google/docs/getting-started?tab=cli"
# Source: https://antigravity.google/pricing (checked 2026-11-17)
free_tier = "yes"
# Source: https://antigravity.google/pricing (checked 2026-11-17)
free_tier_checked_at = "2026-11-17"
# Source: https://antigravity.google/pricing (checked 2026-11-17)
free_tier_source = "https://antigravity.google/pricing"
# Source: https://antigravity.google/docs/getting-started?tab=cli (checked 2026-11-17)
install_paths = ["~/.local/bin/agy"]
# Paths the harness creates inside a project (checked 2026-09-30): rules, workflows and skills live in .agents/ (antigravity.google/docs/rules).
project_paths = [".agents/"]

[[install_commands]]
os = "linux"
command = "curl -fsSL https://antigravity.google/cli/install.sh | bash"
description = "Install the agy CLI with the official script"
requires = ["curl", "bash"]
source_url = "https://antigravity.google/docs/getting-started?tab=cli"

[[install_commands]]
os = "macos"
command = "curl -fsSL https://antigravity.google/cli/install.sh | bash"
description = "Install the agy CLI with the official script"
requires = ["curl", "bash"]
source_url = "https://antigravity.google/docs/getting-started?tab=cli"

[fields_mapping]
env = "environment"
url = "serverUrl"

[required_fields]
type = ["stdio", "local"]

[server_extras.canopy]
enabled = true

[server_extras.filesystem]
enabled = true

[server_extras.fetch]
enabled = true

[cli]
binary = "agy"
headless_mode = "--dangerously-skip-permissions --print-timeout 24h"
interactive_args = ""
model_flag = "--model"
supports_working_dir = true
working_dir_flag = "--add-dir"
yolo_flag = "--dangerously-skip-permissions"
accent_color = [138, 180, 248]
resume_args = "--continue"
session_list_cmd = ""
session_resume_cmd = "--conversation"
invocation_template = "-p={{prompt}} --model {{model}} --effort {{effort}} --add-dir {{workdir}}"

[cli.effort_declaration]
form = "--effort"
values = ["low", "medium", "high"]
