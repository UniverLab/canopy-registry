name = "qwen"
provider = "Alibaba"
tool_name = "Qwen Code"
config_path = ".qwen/settings.json"
mcp_servers_key = ["mcpServers"]
deprecated_keys = []
unsupported_keys = ["autoApprove", "disabled", "tools", "headers"]
skills_dir = ".agents/skills"
instruction_file = "AGENTS.md"
# Personal instructions every session loads, home-relative (checked 2026-11-17): https://qwenlm.github.io/qwen-code-docs/en/users/features/memory/
user_instruction_file = ".qwen/QWEN.md"
# Source: https://qwenlm.github.io/qwen-code-docs/en/users/quickstart/ (checked 2026-11-17)
docs_url = "https://qwenlm.github.io/qwen-code-docs/en/users/quickstart/"
# Paths the harness creates inside a project (checked 2026-09-30): project settings.json, skills/, sandbox profiles (QwenLM/qwen-code docs).
project_paths = [".qwen/"]

[[install_commands]]
os = "linux"
command = "curl -fsSL https://qwen-code-assets.oss-cn-hangzhou.aliyuncs.com/installation/install-qwen-standalone.sh | bash"
description = "Standalone installer (recommended)"
requires = ["curl", "bash"]
source_url = "https://qwenlm.github.io/qwen-code-docs/en/users/quickstart/"

[[install_commands]]
os = "macos"
command = "curl -fsSL https://qwen-code-assets.oss-cn-hangzhou.aliyuncs.com/installation/install-qwen-standalone.sh | bash"
description = "Standalone installer (recommended)"
requires = ["curl", "bash"]
source_url = "https://qwenlm.github.io/qwen-code-docs/en/users/quickstart/"

[[install_commands]]
os = "windows"
command = "irm https://qwen-code-assets.oss-cn-hangzhou.aliyuncs.com/installation/install-qwen-standalone.ps1 | iex"
description = "Standalone installer in PowerShell (recommended)"
requires = ["powershell"]
source_url = "https://qwenlm.github.io/qwen-code-docs/en/users/quickstart/"

[[install_commands]]
os = "linux"
command = "brew install qwen-code"
description = "Homebrew formula"
requires = ["brew"]
source_url = "https://qwenlm.github.io/qwen-code-docs/en/users/quickstart/"

[[install_commands]]
os = "macos"
command = "brew install qwen-code"
description = "Homebrew formula"
requires = ["brew"]
source_url = "https://qwenlm.github.io/qwen-code-docs/en/users/quickstart/"

[[install_commands]]
os = "linux"
command = "npm install -g @qwen-code/qwen-code@latest"
description = "Manual install from npm (Node.js 22+)"
requires = ["npm"]
source_url = "https://qwenlm.github.io/qwen-code-docs/en/users/quickstart/"

[[install_commands]]
os = "macos"
command = "npm install -g @qwen-code/qwen-code@latest"
description = "Manual install from npm (Node.js 22+)"
requires = ["npm"]
source_url = "https://qwenlm.github.io/qwen-code-docs/en/users/quickstart/"

[[install_commands]]
os = "windows"
command = "npm install -g @qwen-code/qwen-code@latest"
description = "Manual install from npm (Node.js 22+)"
requires = ["npm"]
source_url = "https://qwenlm.github.io/qwen-code-docs/en/users/quickstart/"

[fields_mapping]
env = "environment"

[required_fields]
type = ["stdio", "local"]

[server_extras.canopy]
enabled = true

[server_extras.filesystem]
enabled = true

[server_extras.fetch]
enabled = true

[cli]
binary = "qwen"
headless_mode = "-p"
interactive_args = ""
model_flag = "-m"
supports_working_dir = true
working_dir_flag = ""
yolo_flag = "--yolo"
accent_color = [255, 102, 0]
resume_args = "--continue"
session_list_cmd = ""
session_resume_cmd = "--resume"
session_id_set_flag = "--session-id"
invocation_template = "-m {{model}} {{session_flag}} {{session_id}} {{prompt}}"

[cli.effort_declaration]
form = ""
values = []
