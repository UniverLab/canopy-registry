name = "cline"
provider = "Cline"
tool_name = "Cline CLI"
config_path = ".cline/data/settings/cline_mcp_settings.json"
command_format = "merged"
mcp_servers_key = ["mcpServers"]
deprecated_keys = []
unsupported_keys = ["autoApprove", "disabled", "tools", "headers"]
skills_dir = ".agents/skills"
instruction_file = ".clinerules"
# Personal instructions every session loads, home-relative (checked 2026-11-17): https://docs.cline.bot/features/cline-rules/overview
user_instruction_file = ".agents/AGENTS.md"
# Source: https://docs.cline.bot/cline-cli/installation (checked 2026-11-17)
docs_url = "https://docs.cline.bot/cline-cli/installation"
# Source: https://cline.bot/pricing (checked 2026-11-17)
free_tier = "yes"
# Source: https://cline.bot/pricing (checked 2026-11-17)
free_tier_checked_at = "2026-11-17"
# Source: https://cline.bot/pricing (checked 2026-11-17)
free_tier_source = "https://cline.bot/pricing"
# Source: https://docs.cline.bot/cline-cli/installation (checked 2026-11-17)
login_command = "cline auth"
# Source: https://docs.cline.bot/cline-cli/installation (checked 2026-11-17)
login_checked_at = "2026-11-17"
# Paths the harness creates inside a project (checked 2026-09-30): CLI hooks dir and ignore file; .clinerules is the instruction file (docs.cline.bot).
project_paths = [".cline/", ".clineignore"]

[[install_commands]]
os = "linux"
command = "npm install -g cline"
description = "Install the Cline CLI from npm"
requires = ["npm"]
source_url = "https://docs.cline.bot/cline-cli/installation"

[[install_commands]]
os = "macos"
command = "npm install -g cline"
description = "Install the Cline CLI from npm"
requires = ["npm"]
source_url = "https://docs.cline.bot/cline-cli/installation"

[[install_commands]]
os = "windows"
command = "npm install -g cline"
description = "Install the Cline CLI from npm"
requires = ["npm"]
source_url = "https://docs.cline.bot/cline-cli/installation"

[fields_mapping]
env = "environment"

[required_fields]
type = ["stdio", "local"]

[server_extras.canopy]
enabled = true

[server_extras.filesystem]
enabled = true

[server_extras.fetch]
enabled = true

[cli]
binary = "cline"
headless_mode = "-a"
interactive_args = ""
model_flag = "-m"
supports_working_dir = true
working_dir_flag = "-c"
yolo_flag = "--yolo"
accent_color = [0, 122, 255]
resume_args = ""
session_list_cmd = "history"
session_resume_cmd = "--id"
session_list_format_args = "--json"
session_id_pattern = '"sessionId"\s*:\s*"([^"]+)"'
invocation_template = "--thinking {{effort}} -m {{model}} -c {{workdir}} {{prompt}}"

[cli.effort_declaration]
form = "--thinking"
values = ["none", "low", "medium", "high", "xhigh"]
