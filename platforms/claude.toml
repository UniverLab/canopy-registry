name = "claude"
provider = "Anthropic"
tool_name = "Claude Code"
config_path = ".claude.json"
mcp_servers_key = ["mcpServers"]
deprecated_keys = []
unsupported_keys = ["autoApprove", "disabled", "tools"]
skills_dir = ".claude/skills"
# Claude Code reads AGENTS.md natively since v2.1.277 (2026-09-18), as a
# fallback: a CLAUDE.md, .claude/CLAUDE.md or CLAUDE.local.md in the working
# directory or above it takes precedence and AGENTS.md is then ignored
# (https://code.claude.com/docs/en/memory#agents-md). AGENTS.md is the file
# every other harness in this registry shares, so it is the one declared here.
instruction_file = "AGENTS.md"
# Personal instructions every session loads, home-relative (checked 2026-11-17): https://code.claude.com/docs/en/memory
user_instruction_file = ".claude/CLAUDE.md"
# Source: https://code.claude.com/docs/en/setup (checked 2026-11-17)
docs_url = "https://code.claude.com/docs/en/setup"
# Source: https://claude.com/pricing (checked 2026-11-17)
free_tier = "no"
# Source: https://claude.com/pricing (checked 2026-11-17)
free_tier_checked_at = "2026-11-17"
# Source: https://claude.com/pricing (checked 2026-11-17)
free_tier_source = "https://claude.com/pricing"
# Source: https://code.claude.com/docs/en/setup (checked 2026-11-17)
install_paths = ["~/.local/bin/claude"]
# Source: https://code.claude.com/docs/en/cli-reference (checked 2026-11-17)
login_command = "claude auth login"
# Source: https://code.claude.com/docs/en/cli-reference (checked 2026-11-17)
login_check_command = "claude auth status"
# Source: https://code.claude.com/docs/en/cli-reference (checked 2026-11-17)
login_checked_at = "2026-11-17"
# Paths the harness creates inside a project (checked 2026-09-30): .claude/ tree, project MCP file, personal instructions (code.claude.com/docs/en/claude-directory).
project_paths = [".claude/", ".mcp.json", "CLAUDE.local.md"]
# Files Claude reads INSTEAD of AGENTS.md when present, in order.
instruction_precedence = ["CLAUDE.md", ".claude/CLAUDE.md", "CLAUDE.local.md"]

[[install_commands]]
os = "linux"
command = "curl -fsSL https://claude.ai/install.sh | bash"
description = "Native installer (recommended)"
requires = ["curl", "bash"]
source_url = "https://code.claude.com/docs/en/setup"

[[install_commands]]
os = "macos"
command = "curl -fsSL https://claude.ai/install.sh | bash"
description = "Native installer (recommended)"
requires = ["curl", "bash"]
source_url = "https://code.claude.com/docs/en/setup"

[[install_commands]]
os = "macos"
command = "brew install --cask claude-code"
description = "Homebrew cask (stable channel, manual updates)"
requires = ["brew"]
source_url = "https://code.claude.com/docs/en/setup"

[[install_commands]]
os = "windows"
command = "irm https://claude.ai/install.ps1 | iex"
description = "Native installer in PowerShell (recommended)"
requires = ["powershell"]
source_url = "https://code.claude.com/docs/en/setup"

[[install_commands]]
os = "windows"
command = "winget install Anthropic.ClaudeCode"
description = "WinGet package (manual updates)"
requires = ["winget"]
source_url = "https://code.claude.com/docs/en/setup"

[required_fields]
type = ["stdio", "http"]

[cli]
binary = "claude"
headless_mode = "-p --dangerously-skip-permissions"
interactive_args = ""
resume_args = "--resume"
model_flag = "--model"
supports_working_dir = false
yolo_flag = "--dangerously-skip-permissions"
accent_color = [217, 119, 87]
session_id_set_flag = "--session-id"
# Headless resume-by-id (RS2): claude resumes a session by id in print mode,
# pairing with the set-at-spawn id above so a fail-edge bounce continues the
# same session. Verified 2026-07-17 via `claude --help`:
#   -r, --resume [value]   Resume a conversation by session ID, or ...
session_resume_cmd = "--resume"
invocation_template = "--effort {{effort}} --model {{model}} {{session_flag}} {{session_id}} {{prompt}}"

[cli.effort_declaration]
form = "--effort"
values = ["low", "medium", "high", "xhigh", "max"]
