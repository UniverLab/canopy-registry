name = "claude"
provider = "Anthropic"
tool_name = "Claude Code"
config_path = ".claude.json"
mcp_servers_key = ["mcpServers"]
deprecated_keys = []
unsupported_keys = ["autoApprove", "disabled", "tools"]
skills_dir = ".claude/skills"
# Claude Code reads AGENTS.md natively since v2.1.277 (2026-09-18), as a
# fallback: a CLAUDE.md, .claude/CLAUDE.md or CLAUDE.local.md in the working
# directory or above it takes precedence and AGENTS.md is then ignored
# (https://code.claude.com/docs/en/memory#agents-md). AGENTS.md is the file
# every other harness in this registry shares, so it is the one declared here.
instruction_file = "AGENTS.md"

[required_fields]
type = ["stdio", "http"]

[cli]
binary = "claude"
headless_mode = "-p --dangerously-skip-permissions"
interactive_args = ""
resume_args = "--resume"
model_flag = "--model"
supports_working_dir = false
yolo_flag = "--dangerously-skip-permissions"
accent_color = [217, 119, 87]
session_id_set_flag = "--session-id"
# Headless resume-by-id (RS2): claude resumes a session by id in print mode,
# pairing with the set-at-spawn id above so a fail-edge bounce continues the
# same session. Verified 2026-07-17 via `claude --help`:
#   -r, --resume [value]   Resume a conversation by session ID, or ...
session_resume_cmd = "--resume"
invocation_template = "--effort {{effort}} --model {{model}} {{session_flag}} {{session_id}} {{prompt}}"

[cli.effort_declaration]
form = "--effort"
values = ["low", "medium", "high", "xhigh", "max"]
