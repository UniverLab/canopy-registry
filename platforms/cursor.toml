name = "cursor"
provider = "Cursor"
tool_name = "Cursor CLI"
config_path = ".cursor/mcp.json"
mcp_servers_key = ["mcpServers"]
deprecated_keys = []
unsupported_keys = ["autoApprove", "disabled", "tools", "headers"]
skills_dir = ".agents/skills"
instruction_file = ".cursor/rules"
# Paths the harness creates inside a project (checked 2026-09-30): rules/ plus the two ignore files.
project_paths = [".cursor/", ".cursorignore", ".cursorindexingignore"]

# Cursor drops every server whose type is "local" ("No MCP servers configured", checked 2026-10-29),
# and reads env vars from `env`, so neither is remapped.
[required_fields]
type = ["stdio"]

[server_extras.canopy]
enabled = true

[server_extras.filesystem]
enabled = true

[server_extras.fetch]
enabled = true

[cli]
binary = "agent"
headless_mode = "-p --force --trust --approve-mcps"
interactive_args = ""
model_flag = "--model"
supports_working_dir = true
working_dir_flag = "--workspace"
yolo_flag = "--yolo"
accent_color = [0, 150, 136]
resume_args = "--continue"
session_list_cmd = ""
session_resume_cmd = "--resume"
invocation_template = "{{model}}[context=1m,effort={{effort}},fast=false] --workspace {{workdir}} {{prompt}}"

[cli.effort_declaration]
form = "embedded_in_model"
values = ["high"]
