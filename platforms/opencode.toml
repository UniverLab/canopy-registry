name = "opencode"
provider = "SST"
tool_name = "opencode"
config_path = ".config/opencode/opencode.json"
command_format = "merged"
mcp_servers_key = ["mcp"]
deprecated_keys = ["task-trigger"]
unsupported_keys = ["autoApprove", "disabled", "tools", "headers"]
skills_dir = ".agents/skills"
instruction_file = "AGENTS.md"

[fields_mapping]
env = "environment"

[required_fields]
type = ["local"]

[server_extras.canopy]
enabled = true

[server_extras.filesystem]
enabled = true

[server_extras.fetch]
enabled = true

[cli]
binary = "opencode"
# v2 renamed the permission bypass to `--auto` ("auto-approve permissions that
# are not explicitly denied") and exposes it on the interactive command too.
# `--dangerously-skip-permissions` is still accepted by v2.0.12 (unknown flags
# are rejected outright, so it is honoured, not ignored), but `--auto` is the
# documented name and the only one the interactive mode takes.
headless_mode = "run --auto"
interactive_args = "--auto"
model_flag = "-m"
# opencode v2 removed `--dir`: `opencode run --dir <path>` answers
# "Unrecognized flag: --dir in command opencode run" and the run dies before
# the model is reached. The directory is a positional on the INTERACTIVE
# command (`opencode [flags] [directory]`), not a flag on `run`, so canopy
# sets the process cwd instead. Verified 2026-09-22 on opencode v2.0.12.
supports_working_dir = false
accent_color = [92, 156, 245]
resume_args = "-c"
session_list_cmd = "session list"
session_resume_cmd = "--session"
# opencode is a universal gateway: `opencode models` prints every model it can
# run, one passable id per line in the `provider/model` form its `-m` flag
# requires (e.g. `opencode/big-pickle`, `opencode-go/glm-5.2`). models.dev knows
# neither this prefix form nor opencode's private zen catalog, so agent_models
# treats this enumeration as the authoritative source of passable ids for the
# platform. Verified 2026-07-21:
#   $ opencode models
#   opencode/big-pickle
#   opencode/mimo-v2.5-free
#   opencode-go/glm-5.2
#   ...
models_list_cmd = "models"
# List-after-run session id capture (RS1 phase 2): opencode has no set-at-spawn
# flag, but `session list --format json` emits a stable JSON array whose
# objects carry an `"id"` key. Verified 2026-07-17:
#   $ opencode session list --format json
#   [ { "id": "ses_09391965fffecUt48fWM7DI5Yq", "title": "...", ... }, ... ]
session_list_format_args = "--format json"
session_id_pattern = '"id"\s*:\s*"([^"]+)"'
invocation_template = "-m {{model}} {{prompt}}"

# v2 removed the `--variant` FLAG as well: `opencode run --variant high`
# answers "Unrecognized flag: --variant in command opencode run". The variant
# now rides on the model id itself — `--model, -m string  Model to use in the
# format provider/model#variant` — so effort is declared by naming the model
# as `opencode/big-pickle#high`, not by a separate argument, and this platform
# no longer declares an effort form. Verified 2026-09-22 on opencode v2.0.12.
#
# An in-token form (`-m {{model}}#{{effort}}`) is NOT usable today: canopy's
# template engine drops a whole token when any marker in it is unavailable, so
# a run without effort would lose the model too. A registry that can express
# "optional marker inside a token" would let this platform declare effort
# again.
