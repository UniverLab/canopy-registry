name = "copilot"
config_path = ".copilot/mcp-config.json"
mcp_servers_key = ["mcpServers"]
deprecated_keys = ["task-trigger"]
unsupported_keys = ["headers"]
skills_dir = ".agents/skills"
instruction_file = ".github/copilot-instructions.md"

[required_fields]
type = ["stdio", "local"]

[server_extras.canopy]
tools = ["*"]

[server_extras.filesystem]
tools = ["*"]

[server_extras.fetch]
tools = ["*"]

[cli]
binary = "copilot"
headless_mode = "--allow-all"
interactive_args = ""
model_flag = "--model"
supports_working_dir = false
yolo_flag = "--allow-all-tools"
accent_color = [170, 0, 170]
resume_args = "--continue"
# No `session_id_set_flag`. copilot's `--session-id` RESUMES an existing
# session, it does not name a new one, so handing it a freshly minted uuid is
# wrong on its own terms. It also broke every real run: the engine injects the
# session flag between the headless flags and the prompt, and `-p/--prompt`
# takes a value — so `-p --session-id <uuid> <prompt>` made `--session-id` the
# prompt text and left the uuid and the real prompt as stray positionals,
# which the CLI reports as "your prompt was not quoted". Resume by id belongs
# in `session_resume_cmd` (`--resume`) if it is ever wired up.
invocation_template = "-p {{prompt}} {{session_flag}} {{session_id}} --model {{model}}"

[cli.effort_declaration]
form = "--effort"
values = ["none", "minimal", "low", "medium", "high", "xhigh", "max"]
