name = "commandcode"
provider = "Command Code"
tool_name = "Command Code"
# User-scope MCP config (`command-code mcp add -s user`); the default scope
# `local` writes ~/.commandcode/projects/<dir>/mcp.json instead. Verified
# 2026-09-28 by adding and removing a probe server in each scope.
config_path = ".commandcode/mcp.json"
mcp_servers_key = ["mcpServers"]
deprecated_keys = []
unsupported_keys = ["autoApprove", "disabled", "tools"]
skills_dir = ".agents/skills"
instruction_file = "AGENTS.md"
# Paths the harness creates inside a project (checked 2026-09-30): taste/, skills/, memory/ (commandcode.ai/docs/taste).
project_paths = [".commandcode/"]

# Entries use `transport`, not `type`: `{"transport": "stdio", "enabled": true,
# "command": ..., "args": [...]}` as `command-code mcp add` writes them.
[required_fields]
transport = ["stdio", "http"]

[server_extras.canopy]
enabled = true

[server_extras.filesystem]
enabled = true

[server_extras.fetch]
enabled = true

[cli]
binary = "command-code"
# `--yolo` bypasses every permission prompt; `-p/--print` runs one turn and
# exits. Verified 2026-09-28 (v1.66.0):
#   command-code --yolo -p --model deepseek/deepseek-v4-flash "…"  → exit 0
headless_mode = "--yolo -p"
interactive_args = ""
model_flag = "--model"
# No --cwd flag (`--add-dir` only widens tool access); canopy sets the cwd.
supports_working_dir = false
yolo_flag = "--yolo"
accent_color = [175, 215, 255]
resume_args = "-c"
# Session resume (RS1/RS2). command-code has no --session-id, but `--name`
# sets a caller-chosen session name and `-r <name>` resumes it by that name.
# canopy mints a UUID and passes it as the name, then resumes with it.
# Verified 2026-10-09 (v1.79.2), headless with `--yolo -p`:
#   --name <uuid> "Remember 4471…" → OK; -r <uuid> "Which number?" → 4471
#   -r <unknown> → `No session "…" found to resume.`, exit 1 (no picker)
session_resume_cmd = "-r"
session_id_set_flag = "--name"
# `--list-models` prints `<id>  <description>` rows under section headings
# (82 models on 2026-09-28, default deepseek/deepseek-v4-flash); not wired as
# models_list_cmd until canopy parses that shape.
invocation_template = "--model {{model}} {{session_flag}} {{session_id}} {{prompt}}"

# `--effort` exists but its accepted values depend on the model: for
# deepseek/deepseek-v4-flash it rejects `low` ("Supported: high, max") and
# exits 1. Declared as unsupported so canopy never passes a value that fails.
[cli.effort_declaration]
form = ""
values = []
