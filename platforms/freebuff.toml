name = "freebuff"
provider = "Codebuff"
tool_name = "Freebuff"
# Freebuff loads MCP servers from `.agents/mcp.json` in the cwd, its parent,
# and the home directory (read from the bundled CLI, 2026-09-28); the home one
# is the only global location.
config_path = ".agents/mcp.json"
mcp_servers_key = ["mcpServers"]
deprecated_keys = []
unsupported_keys = ["autoApprove", "disabled", "tools", "type"]
skills_dir = ".agents/skills"
instruction_file = "knowledge.md"
# Source: https://freebuff.com/ (checked 2026-11-17)
docs_url = "https://freebuff.com/"
# Source: https://freebuff.com/ (checked 2026-11-17)
free_tier = "yes"
# Source: https://freebuff.com/ (checked 2026-11-17)
free_tier_checked_at = "2026-11-17"
# Source: https://freebuff.com/ (checked 2026-11-17)
free_tier_source = "https://freebuff.com/"
# Source: `freebuff login --help` on the installed binary (checked 2026-11-17)
login_command = "freebuff login"
# Source: `freebuff login --help` on the installed binary (checked 2026-11-17)
login_checked_at = "2026-11-17"
# Paths the harness creates inside a project (checked 2026-09-30): .agents/mcp.json and agent definitions.
project_paths = [".agents/"]

[[install_commands]]
os = "linux"
command = "npm install -g freebuff"
description = "Install Freebuff from npm"
requires = ["npm"]
source_url = "https://freebuff.com/"

[[install_commands]]
os = "macos"
command = "npm install -g freebuff"
description = "Install Freebuff from npm"
requires = ["npm"]
source_url = "https://freebuff.com/"

[[install_commands]]
os = "windows"
command = "npm install -g freebuff"
description = "Install Freebuff from npm"
requires = ["npm"]
source_url = "https://freebuff.com/"

[cli]
binary = "freebuff"
# INTERACTIVE ONLY. v0.1.2 has no print/headless mode: `--print`, `--headless`
# and `-p` are all "unknown option", and the only positional is the `login`
# command. Free ("sponsored") runs also restrict tools to an allowlist, so MCP
# tools are not guaranteed. Kept for live sessions; `headless = false` marks it
# interactive-only so canopy never offers it to a graph node, an ensemble
# member, an agent, or a probe, and an empty headless_mode is legal only
# alongside it (validate_platforms.sh).
headless_mode = ""
headless = false
interactive_args = ""
model_flag = ""
supports_working_dir = true
working_dir_flag = "--cwd"
yolo_flag = ""
accent_color = [158, 252, 98]
resume_args = "--continue"
invocation_template = "{{prompt}}"

[cli.effort_declaration]
form = ""
values = []
