name = "continue"
provider = "Continue"
tool_name = "Continue CLI"
config_path = ".continue/config.json"
mcp_servers_key = ["mcpServers"]
deprecated_keys = []
unsupported_keys = ["autoApprove", "disabled", "tools", "headers"]
skills_dir = ".agents/skills"
instruction_file = ".continue/rules"
# Source: https://docs.continue.dev/cli/quickstart (checked 2026-11-17)
docs_url = "https://docs.continue.dev/cli/quickstart"
# Source: https://docs.continue.dev/cli/quickstart (checked 2026-11-17)
login_command = "cn login"
# Source: https://docs.continue.dev/cli/quickstart (checked 2026-11-17)
login_checked_at = "2026-11-17"
# Paths the harness creates inside a project (checked 2026-09-30): rules/, configs/, agents/ (docs.continue.dev).
project_paths = [".continue/"]

[[install_commands]]
os = "linux"
command = "curl -fsSL https://raw.githubusercontent.com/continuedev/continue/main/extensions/cli/scripts/install.sh | bash"
description = "Install Continue CLI with the official script"
requires = ["curl", "bash"]
source_url = "https://docs.continue.dev/cli/quickstart"

[[install_commands]]
os = "macos"
command = "curl -fsSL https://raw.githubusercontent.com/continuedev/continue/main/extensions/cli/scripts/install.sh | bash"
description = "Install Continue CLI with the official script"
requires = ["curl", "bash"]
source_url = "https://docs.continue.dev/cli/quickstart"

[fields_mapping]
env = "environment"

[required_fields]
type = ["stdio", "local"]

[server_extras.canopy]
enabled = true

[server_extras.filesystem]
enabled = true

[server_extras.fetch]
enabled = true

[cli]
binary = "cn"
headless_mode = "-p"
interactive_args = ""
model_flag = "--model"
supports_working_dir = true
working_dir_flag = ""
yolo_flag = "--auto"
accent_color = [138, 43, 226]
resume_args = "--resume"
session_list_cmd = "ls"
session_resume_cmd = "--fork"
# List-after-run session id capture (RS1 phase 2): cn has no set-at-spawn flag,
# but `cn ls --json` emits an object wrapping a `sessions` array whose entries
# carry a UUID `"id"`. The shared `"id"` pattern matches it too. Verified
# 2026-07-17:
#   $ cn ls --json
#   { "sessions": [ { "id": "8ae15a84-fec0-43b4-9cb8-47293662302e", ... }, ... ] }
session_list_format_args = "--json"
session_id_pattern = '"id"\s*:\s*"([^"]+)"'
invocation_template = "--model {{model}} {{prompt}}"

[cli.effort_declaration]
form = ""
values = []
