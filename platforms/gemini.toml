name = "gemini"
config_path = ".gemini/settings.json"
mcp_servers_key = ["mcpServers"]
deprecated_keys = []
unsupported_keys = ["autoApprove", "disabled", "tools", "headers"]
skills_dir = ".agents/skills"
instruction_file = "GEMINI.md"

[required_fields]
type = ["stdio"]

[cli]
binary = "gemini"
# `--print` does not exist: the CLI rejects it with "Unknown argument: print".
# Headless is `-p/--prompt <text>`, and since the prompt is appended right
# after these flags, `-p` has to be LAST or it swallows the next flag as its
# value. `--skip-trust` is required because a headless run in an untrusted
# directory exits 55 rather than prompting.
headless_mode = "--skip-trust"
interactive_args = ""
model_flag = "--model"
# `--cwd` does not exist either; gemini has no working-directory flag (only
# `--include-directories`, which adds to the workspace rather than moving it).
supports_working_dir = false
yolo_flag = "--yolo"
session_id_set_flag = "--session-id"
accent_color = [192, 158, 228]
resume_args = "--resume"
# Restored `session_id_set_flag` — template controls argv order so `-p` is
# immediately followed by the prompt: `{{session_flag}} {{session_id}} -p {{prompt}}`.
invocation_template = "{{session_flag}} {{session_id}} -p {{prompt}} --model {{model}}"

[cli.effort_declaration]
form = ""
values = []
