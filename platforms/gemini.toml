name = "gemini"
provider = "Google"
tool_name = "Gemini CLI"
config_path = ".gemini/settings.json"
mcp_servers_key = ["mcpServers"]
deprecated_keys = []
unsupported_keys = ["autoApprove", "disabled", "tools", "headers"]
skills_dir = ".agents/skills"
instruction_file = "GEMINI.md"
# Personal instructions every session loads, home-relative (checked 2026-11-17): https://geminicli.com/docs/cli/gemini-md/
user_instruction_file = ".gemini/GEMINI.md"
# Source: https://geminicli.com/docs/get-started/installation/ (checked 2026-11-17)
docs_url = "https://geminicli.com/docs/get-started/installation/"
# Source: https://geminicli.com/docs/resources/quota-and-pricing/ (checked 2026-11-17)
free_tier = "yes"
# Source: https://geminicli.com/docs/resources/quota-and-pricing/ (checked 2026-11-17)
free_tier_checked_at = "2026-11-17"
# Source: https://geminicli.com/docs/resources/quota-and-pricing/ (checked 2026-11-17)
free_tier_source = "https://geminicli.com/docs/resources/quota-and-pricing/"
# Paths the harness creates inside a project (checked 2026-09-30): project settings.json and commands (geminicli.com/docs/reference/configuration).
project_paths = [".gemini/"]

[[install_commands]]
os = "linux"
command = "npm install -g @google/gemini-cli"
description = "Install Gemini CLI from npm (Node.js 20+)"
requires = ["npm"]
source_url = "https://geminicli.com/docs/get-started/installation/"

[[install_commands]]
os = "macos"
command = "npm install -g @google/gemini-cli"
description = "Install Gemini CLI from npm (Node.js 20+)"
requires = ["npm"]
source_url = "https://geminicli.com/docs/get-started/installation/"

[[install_commands]]
os = "windows"
command = "npm install -g @google/gemini-cli"
description = "Install Gemini CLI from npm (Node.js 20+)"
requires = ["npm"]
source_url = "https://geminicli.com/docs/get-started/installation/"

[required_fields]
type = ["stdio"]

[cli]
binary = "gemini"
# `--print` does not exist: the CLI rejects it with "Unknown argument: print".
# Headless is `-p/--prompt <text>`, and since the prompt is appended right
# after these flags, `-p` has to be LAST or it swallows the next flag as its
# value. `--skip-trust` is required because a headless run in an untrusted
# directory exits 55 rather than prompting.
headless_mode = "--skip-trust"
interactive_args = ""
model_flag = "--model"
# `--cwd` does not exist either; gemini has no working-directory flag (only
# `--include-directories`, which adds to the workspace rather than moving it).
supports_working_dir = false
yolo_flag = "--yolo"
session_id_set_flag = "--session-id"
accent_color = [192, 158, 228]
resume_args = "--resume"
# Restored `session_id_set_flag` — template controls argv order so `-p` is
# immediately followed by the prompt: `{{session_flag}} {{session_id}} -p {{prompt}}`.
invocation_template = "{{session_flag}} {{session_id}} -p {{prompt}} --model {{model}}"

[cli.effort_declaration]
form = ""
values = []
