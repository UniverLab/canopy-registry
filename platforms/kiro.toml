name = "kiro"
provider = "AWS"
tool_name = "Kiro CLI"
config_path = ".kiro/settings/mcp.json"
mcp_servers_key = ["mcpServers"]
deprecated_keys = ["task-trigger"]
unsupported_keys = ["headers"]
skills_dir = ".kiro/skills"
instruction_file = "AGENTS.md"
# Paths the harness creates inside a project (checked 2026-09-30): steering/, specs/, agents/, settings/mcp.json (kiro.dev/docs/configuration).
project_paths = [".kiro/"]

[required_fields]
type = ["stdio"]

[server_extras.canopy]
disabled = false
autoApprove = []

[cli]
binary = "kiro-cli"
headless_mode = "chat --no-interactive --trust-all-tools"
interactive_args = "chat"
model_flag = "--model"
supports_working_dir = false
yolo_flag = "--trust-all-tools"
accent_color = [175, 135, 255]
resume_args = "--resume-picker"
invocation_template = "--model {{model}} {{prompt}}"

[cli.effort_declaration]
form = ""
values = []
