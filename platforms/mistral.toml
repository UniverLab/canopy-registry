name = "mistral"
provider = "Mistral AI"
tool_name = "Vibe"
config_path = ".vibe/config.toml"
config_format = "toml"
toml_array_format = true
mcp_servers_key = ["mcp_servers"]
deprecated_keys = []
unsupported_keys = ["headers"]
skills_dir = ".vibe/skills"
instruction_file = "AGENTS.md"
# Source: https://docs.mistral.ai/mistral-vibe/terminal/install (checked 2026-11-17)
docs_url = "https://docs.mistral.ai/mistral-vibe/terminal/install"
# Paths the harness creates inside a project (checked 2026-09-30): project tools, skills, agents, prompts, hooks (docs.mistral.ai/vibe).
project_paths = [".vibe/"]

[[install_commands]]
os = "linux"
command = "curl -LsSf https://mistral.ai/vibe/install.sh | bash"
description = "Install Vibe with the official script"
requires = ["curl", "bash"]
source_url = "https://github.com/mistralai/mistral-vibe"

[[install_commands]]
os = "macos"
command = "curl -LsSf https://mistral.ai/vibe/install.sh | bash"
description = "Install Vibe with the official script"
requires = ["curl", "bash"]
source_url = "https://github.com/mistralai/mistral-vibe"

[[install_commands]]
os = "windows"
command = "powershell -ExecutionPolicy ByPass -c \"irm https://astral.sh/uv/install.ps1 | iex\""
description = "Step 1: install uv"
requires = ["powershell"]
source_url = "https://github.com/mistralai/mistral-vibe"

[[install_commands]]
os = "windows"
command = "uv tool install --python 3.14 mistral-vibe"
description = "Step 2: install Vibe with uv"
requires = ["uv"]
source_url = "https://github.com/mistralai/mistral-vibe"

[fields_mapping]
type = "transport"

[required_fields]
transport = ["stdio", "http"]

[cli]
binary = "vibe"
# The template already carries `-p {{prompt}}`, and canopy prepends
# headless_mode to every templated argv, so a `-p` here doubles it: vibe
# answers "the argument '--prompt [<PROMPT>]' cannot be used multiple times"
# and the run dies. `-p` must be followed by the prompt itself ("No prompt
# provided for programmatic mode" otherwise), so it lives in the template only.
# Verified 2026-10-19 with agent_probe (mistral/auto-approve: reachable).
headless_mode = ""
# Headless all the same: the template carries -p. Declared explicitly so the
# empty headless_mode above is not read as an interactive-only platform.
headless = true
interactive_args = ""
model_flag = "--agent"
supports_working_dir = true
working_dir_flag = "--workdir"
yolo_flag = "--agent auto-approve"
accent_color = [251, 133, 1]
resume_args = "-c"
invocation_template = "--agent {{model}} --workdir {{workdir}} -p {{prompt}}"

[cli.effort_declaration]
form = ""
values = []
