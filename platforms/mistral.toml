name = "mistral"
provider = "Mistral AI"
tool_name = "Vibe"
config_path = ".vibe/config.toml"
config_format = "toml"
toml_array_format = true
mcp_servers_key = ["mcp_servers"]
deprecated_keys = []
unsupported_keys = ["headers"]
skills_dir = ".vibe/skills"
instruction_file = "AGENTS.md"
# Paths the harness creates inside a project (checked 2026-09-30): project tools, skills, agents, prompts, hooks (docs.mistral.ai/vibe).
project_paths = [".vibe/"]

[fields_mapping]
type = "transport"

[required_fields]
transport = ["stdio", "http"]

[cli]
binary = "vibe"
# The template already carries `-p {{prompt}}`, and canopy prepends
# headless_mode to every templated argv, so a `-p` here doubles it: vibe
# answers "the argument '--prompt [<PROMPT>]' cannot be used multiple times"
# and the run dies. `-p` must be followed by the prompt itself ("No prompt
# provided for programmatic mode" otherwise), so it lives in the template only.
# Verified 2026-10-19 with agent_probe (mistral/auto-approve: reachable).
headless_mode = ""
interactive_args = ""
model_flag = "--agent"
supports_working_dir = true
working_dir_flag = "--workdir"
yolo_flag = "--agent auto-approve"
accent_color = [251, 133, 1]
resume_args = "-c"
invocation_template = "--agent {{model}} --workdir {{workdir}} -p {{prompt}}"

[cli.effort_declaration]
form = ""
values = []
