name = "blackbox"
provider = "BLACKBOX AI"
tool_name = "BLACKBOX AI CLI"
config_path = ".blackboxcli/settings.json"
mcp_servers_key = ["mcpServers"]
deprecated_keys = []
unsupported_keys = ["autoApprove", "disabled", "tools", "headers"]
skills_dir = ".agents/skills"
instruction_file = "AGENTS.md"
# Source: https://docs.blackbox.ai/features/blackbox-cli/getting-started (checked 2026-11-17)
docs_url = "https://docs.blackbox.ai/features/blackbox-cli/getting-started"
# Paths the harness creates inside a project (checked 2026-09-30): settings.json and subagents/ (Qwen Code fork layout).
project_paths = [".blackboxcli/"]

[[install_commands]]
os = "linux"
command = "curl -fsSL https://blackbox.ai/install.sh | bash"
description = "Install BLACKBOX CLI with the official script"
requires = ["curl", "bash"]
source_url = "https://docs.blackbox.ai/features/blackbox-cli/getting-started"

[[install_commands]]
os = "macos"
command = "curl -fsSL https://blackbox.ai/install.sh | bash"
description = "Install BLACKBOX CLI with the official script"
requires = ["curl", "bash"]
source_url = "https://docs.blackbox.ai/features/blackbox-cli/getting-started"

[[install_commands]]
os = "windows"
command = "iex (irm https://blackbox.ai/install.ps1)"
description = "Install BLACKBOX CLI with the official PowerShell script"
requires = ["powershell"]
source_url = "https://docs.blackbox.ai/features/blackbox-cli/getting-started"

[fields_mapping]
env = "environment"

[required_fields]
type = ["stdio", "local"]

[server_extras.canopy]
enabled = true

[server_extras.filesystem]
enabled = true

[server_extras.fetch]
enabled = true

[cli]
binary = "blackbox"
headless_mode = "-p"
interactive_args = ""
model_flag = "-m"
supports_working_dir = true
working_dir_flag = ""
yolo_flag = "--yolo"
accent_color = [222, 227, 228]
resume_args = ""
session_list_cmd = ""
session_resume_cmd = ""
invocation_template = "-p {{prompt}} -m {{model}}"

[cli.effort_declaration]
form = ""
values = []
